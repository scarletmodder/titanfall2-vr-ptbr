name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ruff and mypy
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0 mypy==2.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
      - name: Guard, with the whole history
        shell: pwsh
        run: python scripts/guard.py --root . --history
      - name: Guards find what they must find
        shell: pwsh
        run: python tests/test_guards.py
      - name: Dictionary and script format
        shell: pwsh
        run: python scripts/check_dictionary.py
      - name: Tests on PowerShell 7
        shell: pwsh
        run: ./tests/test.ps1
      - name: Tests on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version="6.7.1" --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco could not install Inno Setup' }
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Executable tests
        shell: powershell
        run: ./tests/test-exe.ps1
      - name: Installer tests
        shell: powershell
        run: ./tests/test-installer.ps1
      - name: Byte scan of the exe and the installer
        shell: pwsh
        run: python scripts/scan_binary.py dist/Titanfall2VR-PTBR.exe (Get-ChildItem dist/Instalador-*.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            dist/Instalador-*.exe
            dist/SHA256SUMS.txt

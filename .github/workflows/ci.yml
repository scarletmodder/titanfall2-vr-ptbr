name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ruff e mypy
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0 mypy==2.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
      - name: Guarda, com o histórico inteiro
        shell: pwsh
        run: python scripts/guard.py --raiz . --historico
      - name: Guardas acham o que devem achar
        shell: pwsh
        run: python tests/testar_guardas.py
      - name: Formato do dicionário e dos scripts
        shell: pwsh
        run: python scripts/verificar_dicionario.py
      - name: Histórias
        shell: pwsh
        run: python scripts/prepare_round.py --validar-historias docs/historias
      - name: Testes no PowerShell 7
        shell: pwsh
        run: ./tests/testar.ps1
      - name: Testes no Windows PowerShell 5.1
        shell: powershell
        run: ./tests/testar.ps1
      - name: Compilar
        shell: powershell
        run: ./scripts/build.ps1
      - name: Testes do executável
        shell: powershell
        run: ./tests/testar-exe.ps1
      - name: Varredura de bytes do exe e do zip
        shell: pwsh
        run: python scripts/varrer_binario.py dist/Titanfall2VR-PTBR.exe (Get-ChildItem dist/*.zip).FullName

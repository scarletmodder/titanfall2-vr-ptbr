name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Conferir a tag contra a main, o VERSION e as notas
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'O commit da tag não está na main.' }
          $versao = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$versao") { throw "Tag $env:GITHUB_REF_NAME diferente de v$versao" }
          if (-not (Test-Path -LiteralPath "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Faltam as notas da versão' }
      - name: Ruff e mypy
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0 mypy==2.4.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
      - name: Guarda, com o histórico inteiro
        shell: pwsh
        run: python scripts/guard.py --raiz . --historico
      - name: Guardas acham o que devem achar
        shell: pwsh
        run: python tests/testar_guardas.py
      - name: Formato do dicionário e dos scripts
        shell: pwsh
        run: python scripts/verificar_dicionario.py
      - name: Histórias
        shell: pwsh
        run: python scripts/prepare_round.py --validar-historias docs/historias
      - name: Testes no PowerShell 7
        shell: pwsh
        run: ./tests/testar.ps1
      - name: Testes no Windows PowerShell 5.1
        shell: powershell
        run: ./tests/testar.ps1
      - name: Compilar
        shell: powershell
        run: ./scripts/build.ps1
      - name: Testes do executável
        shell: powershell
        run: ./tests/testar-exe.ps1
      - name: Varredura de bytes do exe e do zip
        shell: pwsh
        run: python scripts/varrer_binario.py dist/Titanfall2VR-PTBR.exe (Get-ChildItem dist/*.zip).FullName
      - name: Montar as notas da release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $somas = (Get-Content -Raw dist/SHA256SUMS.txt).Trim()
          $corpo = (Get-Content -Raw -Encoding utf8 "docs/releases/$tag.md").TrimEnd() + "`n`n## SHA-256`n`n``````text`n$somas`n```````n"
          [IO.File]::WriteAllText('dist/notas.md', $corpo)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote
          if-no-files-found: error
          path: |
            dist/Titanfall2VR-PTBR.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notas
          if-no-files-found: error
          path: dist/notas.md

  publicar:
    needs: construir
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notas
          path: notas
      - name: Conferir o conteúdo do pacote
        shell: pwsh
        run: |
          $esperado = @('SHA256SUMS.txt', 'Titanfall2VR-PTBR.exe', "Titanfall2VR-PTBR-$env:GITHUB_REF_NAME.zip") | Sort-Object
          $lista = @(Get-ChildItem -Recurse -File pacote | ForEach-Object { [IO.Path]::GetRelativePath('pacote', $_.FullName).Replace('\', '/') } | Sort-Object)
          $lista | ForEach-Object { Write-Host $_ }
          if (($lista -join '|') -cne ($esperado -join '|')) { throw "O pacote deveria ter exatamente: $($esperado -join ', ')" }
      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = (Get-ChildItem pacote/*.zip).FullName
          gh release create $tag pacote/Titanfall2VR-PTBR.exe $zip pacote/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Titanfall 2 VR em PT-BR $tag" --notes-file notas/notas.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
